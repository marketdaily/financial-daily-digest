name: 財經日報每日發布
# run-name 標記是 winrig run.sh cloud_run_count 的機器可讀訊號(2026-07-28 雙發事故後加):
# winrig 靠它分辨「哪個 market、是不是 dry-run」,別改格式。
run-name: "財經日報每日發布 market=${{ inputs.market || 'tw' }} failover=${{ inputs.failover || '0' }} dry=${{ inputs.dry_run || '0' }}"

# 2026-07-26 改為「純備援」(GitHub 帳號解封後 Actions 復活):
#   winrig 是唯一日常發送者(cron 05:20/19:00 生成、07:00/20:00 寄)。本 workflow 只在
#   winrig 缺席時由 digest-watchdog 派發(failover=1),或人工 dispatch 補救/驗證(dry_run=1)。
#   marketdaily-digest-cron worker 的每日派發已停(crons=[]),防雙發。
#   failover 防雙發三層(2026-07-28 事故補強,單靠起跑閘擋不住「winrig 補班中途完成」):
#     ①起跑閘(下方 guard step):公版存檔已在線上→立即退出
#     ②main.py 寄出前終極閘(MD_FAILOVER=1):存檔上線→退場;winrig 心跳新鮮→輪詢等它交付
#     ③winrig 端 run.sh cloud_run_count:偵測到本 workflow 排隊/執行中/已成功→讓位
on:
  workflow_dispatch:
    inputs:
      market:
        description: "班次市場:tw(台股早報) / us(美股晚報) / both(合併,手動 fallback)"
        required: false
        default: "tw"
        type: choice
        options: ["tw", "us", "both"]
      failover:
        description: "備援模式:1=watchdog 偵測 winrig 缺席後的自動接手(帶防雙發閘)"
        required: false
        default: "0"
      dry_run:
        description: "1=只生成不寄信(驗證雲端環境用)"
        required: false
        default: "0"

permissions:
  contents: write          # 寄信後把當日公版日報 commit 回 main（不重寄、不部署）

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # requirements 的 numpy==2.5.0 需 py3.12(3.11 裝不了,2026-07-25 preflight 失敗根因)

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 防雙發閘 ①(failover 模式):watchdog 偵測→派發之間 winrig 可能遲交完成。
      # 當班已被交付 → 立即安靜退出,既不重寄、也不白燒一整輪雲端生成(~50min CI + 一輪 LLM 額度)。
      #
      # ⚠️ 判準只准呼叫 main._archive_delivered() 本人,禁止在這裡自己 curl 重寫一份。
      #   2026-08-12 查獲舊版 bash 閘的兩個缺陷:①`curl -s` 不跟隨重導,而存檔活著時回 308,
      #   `= "200"` 永遠不成立 ⇒ 這道閘自始至終沒射出過;②只查網站,漏掉 origin 那半訊號
      #   (權威判準是「網站 OR origin」,08-12 那次正是靠 origin 才認出 winrig 已交付)。
      #   結果:憑證死掉導致存檔停止上線的那天,誤派的備援跑滿 51m47s 才在最後一步退場。
      #   契約由 scripts/test_failover_gate_contract.py 守著(改回自己 curl 會紅)。
      #
      # 位置刻意放在裝完依賴之後(import main 需要),仍遠早於生成 ⇒ 省下的是那 ~50 分鐘。
      # 任何例外一律 fail-open(不設 SKIP_SEND)→ 照寄:死線是絕不缺信,寧可重寄不可缺信。
      # 判不出來時發 ::warning:: 讓「閘門啞了」看得見,不再重蹈沉默死碼的覆轍。
      - name: Failover double-send guard
        if: github.event.inputs.failover == '1'
        run: |
          TWDATE=$(TZ=Asia/Taipei date +%F)
          MARKET="${{ github.event.inputs.market || 'tw' }}"
          VERDICT=$(python3 -c "import sys, main; print('DELIVERED' if main._archive_delivered(sys.argv[1], sys.argv[2]) else 'ABSENT')" "$MARKET" "$TWDATE") || VERDICT="ERROR"
          case "$VERDICT" in
            DELIVERED)
              echo "當班公版存檔已交付(winrig 已寄),備援退場不重寄。"
              echo "SKIP_SEND=1" >> "$GITHUB_ENV"
              ;;
            ABSENT)
              echo "未偵測到當班交付 → 備援繼續(查不到一律照寄)。"
              ;;
            *)
              echo "::warning::防雙發閘①判定失敗(main._archive_delivered 拋錯,見上方 traceback)→ fail-open 照寄;第③層 _failover_send_clearance 仍在寄出前守著。"
              ;;
          esac

      # 注意:刻意不帶 ANTHROPIC_API_KEY(2026-07-26 Delvin「全免費」令,雲端也零付費 API;
      # analyzer 免費鏈 Gemini→Groq→CF 對應 secrets 已更新)。
      - name: Run daily digest
        if: env.SKIP_SEND != '1'
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          MARKETDAILY_INTERNAL_TOKEN: ${{ secrets.MARKETDAILY_INTERNAL_TOKEN }}
          MARKETDAILY_ALERT_TOKEN: ${{ secrets.MARKETDAILY_ALERT_TOKEN }}
          MARKET: ${{ github.event.inputs.market || 'tw' }}
          # 寄出前終極防雙發閘(main.py _failover_send_clearance)只在備援模式武裝
          MD_FAILOVER: ${{ github.event.inputs.failover || '0' }}
        run: |
          # 寄出死線與 winrig run.sh 對齊(過線寧可不寄,不發開盤後的盤前信)
          if [ "$MARKET" = "tw" ]; then export MD_SEND_DEADLINE_HM=0840; else export MD_SEND_DEADLINE_HM=2110; fi
          if [ "${{ github.event.inputs.dry_run }}" = "1" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      # 寄信由上一步的 main.py 完成。這一步「只」把當日公版日報 + manifest commit 回 main,
      # 讓戰績 builder(weekly_track_record)checkout 時讀得到本機檔,不再依賴脆弱的 CDN 抓取。
      # 嚴格排除個人化日報(含訂閱者持股),不重寄信、不部署。
      # continue-on-error:寄信在上一步已完成,這步只是存檔回寫;它 push 撞到 winrig 同時段
      # commit 而 fail 時,不可把整個 run 標成 failure——winrig 的 cloud_run_count 以
      # 「completed+success=雲端已代寄」判斷要不要讓位,run 結論必須反映寄信成敗而非存檔成敗
      # (2026-07-28 實例:備援 run 寄出了信卻因 push race 標 failure)。
      # continue-on-error 的用意是「存檔失敗不要擋掉已經寄出去的信」,但它也讓這一步
      # 失敗時整個 run 照樣 ✅ —— 09-15 兩班連續失敗、run 都是 success,沒有任何人知道。
      # ⇒ 保留 continue-on-error,另外補一步把失敗大聲講出來(見下一個 step)。
      - name: Persist public digest archive
        id: persist_archive
        if: success() && env.SKIP_SEND != '1' && github.event.inputs.dry_run != '1'
        continue-on-error: true
        run: |
          rm -f docs/output/*_personal_*.html
          git config user.name "marketdaily-bot"
          git config user.email "marketdailyhq@gmail.com"
          shopt -s nullglob
          for f in docs/output/digest_*.html; do
            case "$f" in *_personal_*) continue;; esac
            git add "$f"
          done
          git add docs/output/manifest.json
          python3 scripts/gen_sitemap.py && git add docs/sitemap.xml || echo "sitemap gen skipped"
          if git diff --cached --quiet; then
            echo "No new public digest to commit."
          else
            git commit -m "chore(digest): persist public archive $(date -u +%Y-%m-%d) (cloud failover)"
            # ⚠️ 2026-09-15 事故:裸 `git pull --rebase` 撞到「本輪自己跑日報時改到、但沒被
            # git add 的其他 tracked 檔」⇒ `cannot pull with rebase: You have unstaged changes`
            # → exit 128,**push 整行沒執行**。commit 只留在 runner 上,隨 job 結束蒸發。
            # 後果不是少一份存檔而已:交付訊號(網站 OR git origin)兩軌都沒亮 ⇒ 守望犬第二檢
            # 喊「日報極可能沒寄!」、heartbeat 喊「今天沒成功寄出」——**信其實 29/29、30/30
            # 都寄出去了**。雲端備援每接手一次就製造一對假紅,而假紅正好落在最該被相信的那則。
            # 這裡用 --autostash 是安全的:runner 是一次性的,樹上的未追蹤改動全是本 job 自己
            # 的副產物,沒有別視窗的 WIP 可偷(winrig 本機那條線的「絕不 --autostash」鐵則
            # 是為了多 session 共用一棵樹,前提不同,不適用於此)。
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

      # 存檔沒推上去 = 交付訊號兩軌皆暗 = 守望犬與 heartbeat 會在幾十分鐘後推「日報沒寄」
      # 的假紅。與其讓人去追一則假紅,不如在這裡就講清楚「信寄了、存檔沒推」。
      - name: Alert if archive persist failed
        if: always() && steps.persist_archive.outcome == 'failure'
        env:
          MARKETDAILY_ALERT_TOKEN: ${{ secrets.MARKETDAILY_ALERT_TOKEN }}
        run: |
          MSG="🟠 雲端備援 ${{ github.event.inputs.market }} 班:信已寄出,但【公版存檔沒推上 origin】(Persist 步驟失敗)。"
          MSG="$MSG 交付訊號兩軌都不會亮 ⇒ 守望犬/heartbeat 接下來的「日報沒寄」是假紅,別照字面追。"
          MSG="$MSG 查 GitHub Actions run ${{ github.run_id }} 的 Persist public digest archive 步驟。"
          curl -sS -X POST "https://marketdaily-alert-worker.delvin-12345678.workers.dev/internal/admin-line-push" \
            -H "Authorization: Bearer $MARKETDAILY_ALERT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,sys;print(json.dumps({"message":sys.argv[1]}))' "$MSG")" || true

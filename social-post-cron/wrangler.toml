name = "marketdaily-social-post-cron"
main = "src/index.js"
compatibility_date = "2026-05-01"

# 2026-07-01: cron 停用(crons=[])。GitHub 帳號 6/12 被 flag 後 Actions 全停,此 Worker 的
# workflow_dispatch 觸發路徑已死;社群發文改由 winrig cron(~/.marketdaily-fallback/social_post_runner.sh,
# 14:00 TW)single-source 執行。保留此 Worker 但關 cron,防 GitHub 解封後 Actions 復活造成與 winrig 雙發。
[triggers]
crons = []


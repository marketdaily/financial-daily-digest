name = "marketdaily-webhook"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 2026-07-09: Custom Domain 取代前端曝光的 workers.dev URL(帳號名 delvin-12345678 外露,
# 見 memory project_privacy_audit)。加法變更——明確保留 workers_dev=true,因為新版 wrangler
# 只要偵測到明確 routes 就會把未寫明的 workers_dev 預設改成 false(實測踩到,曾短暫斷線),
# 舊 workers.dev 子網域需保持可用(給既有 Stripe dashboard webhook 設定/舊書籤/curl 腳本相容)。
workers_dev = true

[[routes]]
pattern = "api.marketdaily.ai"
custom_domain = true

[vars]
BREVO_LIST_ID = "2"
QUOTE_BRIDGE_URL = "https://qb-fc90a8.marketdaily.ai"

[[kv_namespaces]]
binding = "USER_PREFS"
id = "f5229c5bf86a4f8b88d71995005cd670"

# fortune-ai(天機AI)訂單 KV(同 namespace 綁進 fortune-ai worker;webhook 只寫 paid 標記)
[[kv_namespaces]]
binding = "FORTUNE_ORDERS"
id = "0c036b69048e482eb51426f9f7993c21"

# Lifecycle email sweep:每天 22:30 UTC = 隔日 06:30 TWT,跑在日報(06:55 UTC)之前
# Reactive content sweep:每 15 分鐘掃 RSS,命中關鍵字 → AI 寫 hot take → pending(96 次/天,免費層內)
[triggers]
crons = ["30 22 * * *", "*/15 * * * *"]

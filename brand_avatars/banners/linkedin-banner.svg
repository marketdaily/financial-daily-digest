  <rect x="514.0" y="380.2" width="556.1" height="2.3" fill="url(#grid)"/>

  <!-- status row (top of safe band) -->
  <g font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-weight="600">
    <circle cx="643.7" cy="39.6" r="6.6" fill="#4AF626"/>
    <text x="660.2" y="47.0" font-size="20.6" fill="#FFB000" letter-spacing="2">SYSTEM ONLINE · TPE 07:00 / 20:00</text>
  </g>

  <!-- icon -->

    <rect x="2.6" y="40.6" width="10.5" height="19.7" rx="3.3" fill="#A66E00"/>
    <rect x="19.7" y="26.2" width="10.5" height="34.1" rx="3.3" fill="#FFB000"/>
    <rect x="36.7" y="10.5" width="10.5" height="49.8" rx="3.3" fill="url(#ic3)"/>

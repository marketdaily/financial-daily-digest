    <rect x="712.4" y="340.6" width="24.3" height="39.6" rx="3.7" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="757.4" y="312.8" width="24.3" height="67.3" rx="3.7" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="802.3" y="331.1" width="24.3" height="49.1" rx="3.7" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="847.2" y="304.9" width="24.3" height="75.2" rx="3.7" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="892.2" y="323.1" width="24.3" height="57.0" rx="3.7" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="937.1" y="334.2" width="24.3" height="45.9" rx="3.7" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="982.0" y="316.8" width="24.3" height="63.4" rx="3.7" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1027.0" y="327.9" width="24.3" height="52.3" rx="3.7" fill="url(#bandg)" fill-opacity="0.5"/>

    <rect x="1147.0" y="855.4" width="26.0" height="59.2" rx="4.0" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1195.0" y="872.3" width="26.0" height="42.3" rx="4.0" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1243.0" y="842.7" width="26.0" height="71.9" rx="4.0" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1291.0" y="862.1" width="26.0" height="52.5" rx="4.0" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1339.0" y="834.2" width="26.0" height="80.4" rx="4.0" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1387.0" y="853.7" width="26.0" height="60.9" rx="4.0" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1435.0" y="865.5" width="26.0" height="49.1" rx="4.0" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1483.0" y="846.9" width="26.0" height="67.7" rx="4.0" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1531.0" y="858.7" width="26.0" height="55.8" rx="4.0" fill="url(#bandg)" fill-opacity="0.5"/>
  </g>
  <rect x="983.0" y="914.6" width="594.0" height="2.5" fill="url(#grid)"/>

  <!-- status row (top of safe band) -->
  <g font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-weight="600">
    <circle cx="1121.6" cy="550.8" r="7.0" fill="#4AF626"/>
    <text x="1139.2" y="558.7" font-size="22.0" fill="#FFB000" letter-spacing="2">SYSTEM ONLINE · TPE 07:00 / 20:00</text>
  </g>

  <!-- icon -->
  <g transform="translate(937.9,681.5)">
    <rect x="2.8" y="43.4" width="11.2" height="21.0" rx="3.5" fill="#A66E00"/>
    <rect x="21.0" y="28.0" width="11.2" height="36.4" rx="3.5" fill="#FFB000"/>
    <rect x="39.2" y="11.2" width="11.2" height="53.2" rx="3.5" fill="url(#ic3)"/>

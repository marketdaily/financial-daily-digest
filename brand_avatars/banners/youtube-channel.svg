  <!-- tagline -->
  <text x="1280.0" y="811.4" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-weight="500" font-size="27.0" fill="#FFB000" letter-spacing="1">台股日報 07:00 · 美股日報 20:00 · 你的持股逐檔點名 · <tspan fill="#4AF626">NO NOISE, JUST SIGNAL</tspan></text>

  <rect width="2560" height="1440" fill="url(#scan)"/>
  <rect x="3" y="3" width="2554" height="1434" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="6"/>
</svg>
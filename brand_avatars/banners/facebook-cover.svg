    <rect x="715.5" y="615.2" width="32.0" height="52.0" rx="4.9" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="774.5" y="578.8" width="32.0" height="88.4" rx="4.9" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="833.5" y="602.7" width="32.0" height="64.5" rx="4.9" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="892.5" y="568.4" width="32.0" height="98.8" rx="4.9" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="951.5" y="592.3" width="32.0" height="74.9" rx="4.9" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1010.5" y="606.9" width="32.0" height="60.3" rx="4.9" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1069.6" y="584.0" width="32.0" height="83.2" rx="4.9" fill="url(#bandg)" fill-opacity="0.5"/>
    <rect x="1128.6" y="598.6" width="32.0" height="68.6" rx="4.9" fill="url(#bandg)" fill-opacity="0.5"/>

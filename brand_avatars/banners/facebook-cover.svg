<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 856" width="1640" height="856">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0E0A"/>
      <stop offset="100%" stop-color="#060604"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFB000" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#FFB000" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFB000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bandg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#A66E00"/>
      <stop offset="55%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#4AF626"/>
    </linearGradient>
    <linearGradient id="ic3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFC74D"/>
      <stop offset="55%" stop-color="#9FF03A"/>
      <stop offset="100%" stop-color="#4AF626"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect y="3" width="6" height="3" fill="#000" fill-opacity="0.20"/>
    </pattern>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFB000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1640" height="856" fill="url(#bgg)"/>
  <rect width="1640" height="856" fill="url(#glow)"/>

  <!-- skyline -->

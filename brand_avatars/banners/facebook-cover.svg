  </g>

  <!-- icon -->
  <g transform="translate(399.5,380.7)">
    <rect x="3.4" y="53.4" width="13.8" height="25.8" rx="4.3" fill="#A66E00"/>
    <rect x="25.8" y="34.4" width="13.8" height="44.7" rx="4.3" fill="#FFB000"/>
    <rect x="48.2" y="13.8" width="13.8" height="65.4" rx="4.3" fill="url(#ic3)"/>

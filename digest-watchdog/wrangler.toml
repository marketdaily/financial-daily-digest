name = "marketdaily-digest-watchdog"
main = "src/index.js"
compatibility_date = "2026-05-01"

# 2026-07-09: Custom Domain 取代前端曝光的 workers.dev URL(帳號名 delvin-12345678 外露,
# 見 memory project_privacy_audit)。明確保留 workers_dev=true(新版 wrangler 只要偵測到
# 明確 routes 就會把未寫明的 workers_dev 預設改成 false,實測踩過一次短暫斷線)。
workers_dev = true

[[routes]]
pattern = "watchdog.marketdaily.ai"
custom_domain = true

# 2026-07-20 v2 重啟:改為「查公版日報存檔新鮮度」的外部 dead-man 監看,不依賴 GitHub/winrig。
# 背景:6/30 因 v1 綁死已 flag 的 GitHub Actions 而清空 crons,監看改靠 winrig heartbeat.sh;
# 7/19 winrig 整台離線 → heartbeat 與日報一起死,7/20 早報沒寄且零告警。v2 專補此盲區。
# TW 07:30/08:00 早報、20:25/21:00 晚報(UTC 下列);只告警不代跑(runner 在 winrig)。
[triggers]
crons = ["30 23 * * *", "0 0 * * *", "25 12 * * *", "0 13 * * *"]

# 與主 worker 共用 KV,只用 watchdog: 前綴(重派防重 guard)
[[kv_namespaces]]
binding = "USER_PREFS"
id = "f5229c5bf86a4f8b88d71995005cd670"

# LINE 推播走 service binding(workers.dev 同帳號互打被 1042 擋,2026-06-11 實測)
[[services]]
binding = "ALERT"
service = "marketdaily-alert-worker"

# secrets(wrangler secret put):
#   ALERT_TOKEN  — alert-worker /internal/admin-line-push 的 ADMIN_PUSH_TOKEN 同值
#   GITHUB_TOKEN — v2 起不再使用(留著,日報若搬回 Actions 才需要)

# 2026-06-12:查「cron 註冊了但 6/12 整天沒任何執行痕跡」開的持久 log
[observability]
enabled = true

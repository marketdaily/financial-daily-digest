name = "marketdaily-digest-watchdog"
main = "src/index.js"
compatibility_date = "2026-05-01"

# 2026-07-09: Custom Domain 取代前端曝光的 workers.dev URL(帳號名 delvin-12345678 外露,
# 見 memory project_privacy_audit)。明確保留 workers_dev=true(新版 wrangler 只要偵測到
# 明確 routes 就會把未寫明的 workers_dev 預設改成 false,實測踩過一次短暫斷線)。
workers_dev = true

[[routes]]
pattern = "watchdog.marketdaily.ai"
custom_domain = true

# 2026-06-30 停用(crons 清空):這隻 watchdog 整個綁死 GitHub Actions —— 查 Actions run、用
# Actions /dispatches 重派。但 6/11 起 GitHub 帳號被 flag、Actions 停用,日報早搬去 winrig cron。
# 結果它每班都找不到 Actions run → 誤判「cron 沒觸發」→ 想用已死的 Actions 重派 → 422 →
# 每天誤報「守望犬已代派(失敗)」。真正的日報成敗監看已由 winrig heartbeat.sh 接手
# (過 07:45/20:45 檢查 log 有無「發送完成」,沒有就 web push + 桌面告 admin,通道實測活著)。
# 故清空 crons 止血。GitHub 解封、日報搬回 Actions 時再恢復;或改寫成「查公版日報新鮮度」的
# 外部 dead-man 監看(補 winrig 整台掛掉的盲區)。詳見 memory project_github_account_flagged。
[triggers]
crons = []

# 與主 worker 共用 KV,只用 watchdog: 前綴(重派防重 guard)
[[kv_namespaces]]
binding = "USER_PREFS"
id = "f5229c5bf86a4f8b88d71995005cd670"

# LINE 推播走 service binding(workers.dev 同帳號互打被 1042 擋,2026-06-11 實測)
[[services]]
binding = "ALERT"
service = "marketdaily-alert-worker"

# secrets(wrangler secret put):
#   GITHUB_TOKEN — 同 digest-cron 那把 PAT(Actions read/write)
#   ALERT_TOKEN  — alert-worker /internal/admin-line-push 的 ADMIN_PUSH_TOKEN 同值

# 2026-06-12:查「cron 註冊了但 6/12 整天沒任何執行痕跡」開的持久 log
[observability]
enabled = true

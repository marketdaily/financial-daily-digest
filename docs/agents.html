<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0A0A08">
<link rel="icon" type="image/svg+xml" href="/logo-icon.svg">
<link rel="apple-touch-icon" href="/logo-icon.svg">
<title>Agent Team 戰情室 · MarketDaily</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :focus-visible { outline:2px solid #4AF626; outline-offset:2px; border-radius:4px; }
  body {
    font-family:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#0A0A08; color:#e7e5f3; min-height:100vh;
    background-image:radial-gradient(900px 500px at 12% -8%,rgba(255,176,0,.22),transparent 70%),
                     radial-gradient(900px 500px at 100% 0%,rgba(244,114,182,.14),transparent 70%);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap { max-width:1180px; margin:0 auto; padding:26px 18px 70px; }
  header { display:flex; justify-content:space-between; align-items:flex-end;
           flex-wrap:wrap; gap:12px; margin-bottom:24px; }
  .brand .kicker { font-size:11px; letter-spacing:3.5px; color:#FFC74D;
                   text-transform:uppercase; }
  .brand h1 { font-size:26px; font-weight:800; color:#fde68a; margin-top:4px; }
  .meta { text-align:right; font-size:12px; color:#8b89a8; line-height:1.8; }
  .lang-btn {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    color:#FFD98A; font-size:12px; font-weight:700; font-family:inherit;
    padding:6px 13px; border-radius:18px; cursor:pointer; transition:all .2s;
    margin-bottom:6px;
  }
  .lang-btn:hover { background:rgba(255,176,0,.18); border-color:rgba(255,176,0,.35); color:#fff; }
  .live { display:inline-flex; align-items:center; gap:6px; font-weight:600; }
  .live.ok { color:#34d399; } .live.warn { color:#fb923c; } .live.err { color:#ff6b6b; }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor;
         animation:pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(52,211,153,.5);}
                     70%{box-shadow:0 0 0 9px rgba(52,211,153,0);}
                     100%{box-shadow:0 0 0 0 rgba(52,211,153,0);} }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:11px; margin-bottom:24px; }
  .stat { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
          border-radius:14px; padding:15px 16px; }
  .stat .n { font-size:28px; font-weight:800; line-height:1; }
  .stat .l { font-size:12px; color:#8b89a8; margin-top:7px; }

  h2.sec { font-size:14px; font-weight:700; color:#FFD98A; margin:28px 0 12px;
           letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  h2.sec::before { content:""; width:3px; height:15px; background:#FFB000; border-radius:2px; }

  .agents { display:grid; grid-template-columns:repeat(auto-fill,minmax(206px,1fr)); gap:12px; }
  .agent { background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08);
           border-radius:16px; padding:15px; position:relative; overflow:hidden; }
  .agent::before { content:""; position:absolute; top:0; left:0; right:0; height:3px;
                   background:var(--ac); }
  .agent .top { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .agent .emoji { font-size:21px; }
  .agent .nm { font-weight:700; font-size:15px; }
  .agent .ds { font-size:11px; color:#8b89a8; }
  .badge { font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px;
           margin-left:auto; white-space:nowrap; }
  .b-working { background:rgba(251,146,60,.18); color:#fb923c; }
  .b-idle    { background:rgba(255,255,255,.07); color:#8b89a8; }
  .agent .tally { display:flex; gap:14px; margin-top:10px; font-size:11px; color:#8b89a8; }
  .agent .tally b { color:#e7e5f3; }
  @media(max-width:880px){ .stats{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:520px){ .stats{grid-template-columns:1fr;} }
  .empty { font-size:12px; color:#5b596e; padding:14px 4px; text-align:center; }

  .feed { background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.07);
          border-radius:14px; padding:6px 4px; }
  .feed .row { display:flex; gap:11px; align-items:baseline; padding:8px 13px;
               font-size:12px; border-bottom:1px solid rgba(255,255,255,.045); }
  .feed .row:last-child { border-bottom:none; }
  .feed .hash { font-family:ui-monospace,Menlo,monospace; color:#4AF626;
                font-size:11px; flex-shrink:0; min-width:42px; }
  .feed .msg { color:#cbd5e1; flex:1; }
  .feed .when { color:#6b6982; flex-shrink:0; font-size:11px; min-width:64px; text-align:right; }
  .daybar { display:block; height:8px; border-radius:5px; width:var(--w,0%);
            background:linear-gradient(90deg,#FFB000,#FFD98A); min-width:3px; }
  footer { text-align:center; margin-top:32px; font-size:11px; color:#56546a; line-height:1.8; }
  .skel { padding:50px 0; text-align:center; color:#6b6982; font-size:13px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="terminal.css?v=1">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="kicker" data-i18n="kicker">MarketDaily · Agent Team</div>
      <h1 data-i18n="h1">🛰️ 夜間戰情室</h1>
    </div>
    <div class="meta">
      <button class="lang-btn" onclick="toggleLang()">EN</button>
      <div class="live warn" id="status"><span class="dot"></span> <span data-i18n="connecting">連線中…</span></div>
      <div id="gen" data-i18n="loading_meta">讀取資料中</div>
    </div>
  </header>
  <div id="body"><div class="skel" data-i18n="loading_board">⏳ 載入戰情室資料…</div></div>
  <footer data-i18n-html="footer">
    夜間值班系統 · 資料每次改版自動重建,只顯示彙整數字(不公開任務內容細節)<br>
    winrig 24/7 自動化引擎產出,本頁無須重新部署即跟著最新進度走
  </footer>
</div>

<script>
const RAW = "/data/board.json";
const STALE_AFTER_MS = 28 * 3600 * 1000;  // board 為每日 14:40 批次 feed,>28h=真的漏跑一天才警示(6h 會每天誤報 20h,2026-07-14 audit)

/* ── i18n ── */
const i18n = {
  zh: {
    page_title: "Agent Team 戰情室 · MarketDaily",
    kicker: "MarketDaily · Agent Team",
    h1: "🛰️ 夜間戰情室",
    connecting: "連線中…",
    loading_meta: "讀取資料中",
    loading_board: "⏳ 載入戰情室資料…",
    footer: "夜間值班系統 · 資料每次改版自動重建,只顯示彙整數字(不公開任務內容細節)<br>winrig 24/7 自動化引擎產出,本頁無須重新部署即跟著最新進度走",
    st_live: "LIVE · 即時運作中", st_stale: "資料稍舊 · 引擎持續運作", st_fail: "連線失敗 · 重試中",
    err_prefix: "⚠ 暫時讀不到資料(", err_suffix: ")<br>board.json 尚未產生或網路問題,5 分鐘後自動重試",
    stat_active: "目前運作中", stat_done7d: "近7天完成", stat_caps: "能力庫積木",
    stat_selfheal: "近7天自動修復",
    sec_team: "值班團隊", sec_activity: "近 7 天活動軌跡",
    empty: "— 空 —", no_activity: "尚無近期資料",
    badge_working: "執行中", badge_idle: "待命",
    tally_done: "近7天完成", tally_selfheal: "自動修復",
    day_suffix: " 項改善",
    generated_at: "資料產生於 ",
    agents: {
      digest_ops: {emoji:"📰", name:"日報 Ops", desc:"每日 AI 財經日報產線 · 帳號/推播/報價"},
      intel:      {emoji:"📡", name:"信息差引擎", desc:"美股/台股/總經即時訊號連接器艦隊"},
      quant:      {emoji:"📈", name:"戰績與量化", desc:"戰績結算 · 可轉債拆解 · 估值模型"},
      growth:     {emoji:"📣", name:"內容與成長", desc:"SEO 內容 · 社群發布 · 成長行銷自動化"},
      engine:     {emoji:"🛠️", name:"引擎自我升級", desc:"站務健檢 · 自動修復 · 能力庫擴充"}
    }
  },
  en: {
    page_title: "Agent Team War Room · MarketDaily",
    kicker: "MarketDaily · Agent Team",
    h1: "🛰️ Night Shift War Room",
    connecting: "Connecting…",
    loading_meta: "Loading data",
    loading_board: "⏳ Loading war room data…",
    footer: "Night shift system · Data is rebuilt automatically on every release (only aggregate counts are shown, no task-level detail)<br>Produced by the winrig 24/7 automation engine — this page stays current without a redeploy",
    st_live: "LIVE · Running", st_stale: "Data slightly stale · engine still running", st_fail: "Connection failed · Retrying",
    err_prefix: "⚠ Can't load data right now (", err_suffix: ")<br>board.json not generated yet or a network issue — auto-retry in 5 min",
    stat_active: "Active now", stat_done7d: "Done (7d)", stat_caps: "Capabilities built",
    stat_selfheal: "Self-healed (7d)",
    sec_team: "On-Duty Team", sec_activity: "Last 7 Days Activity",
    empty: "— Empty —", no_activity: "No recent data",
    badge_working: "Working", badge_idle: "Idle",
    tally_done: "Done (7d)", tally_selfheal: "Self-healed",
    day_suffix: " improvements",
    generated_at: "Data generated at ",
    agents: {
      digest_ops: {emoji:"📰", name:"Digest Ops", desc:"Daily AI financial digest pipeline · accounts/push/quotes"},
      intel:      {emoji:"📡", name:"Intel Engine", desc:"US/TW/macro real-time signal connector fleet"},
      quant:      {emoji:"📈", name:"Track Record & Quant", desc:"Performance settlement · CB analysis · valuation models"},
      growth:     {emoji:"📣", name:"Content & Growth", desc:"SEO content · social publishing · growth automation"},
      engine:     {emoji:"🛠️", name:"Engine Self-Upgrade", desc:"Site health checks · auto-repair · capability building"}
    }
  }
};
let curLang = localStorage.getItem('md-lang-v2') || 'zh';
const T = () => i18n[curLang] || i18n.zh;
let lastBoard = null;
let lastStatusKind = null; // 'ok' | 'warn' | 'err' | null(尚未載入過)

function applyLang(lang) {
  curLang = lang;
  const t = i18n[lang] || i18n.zh;
  document.title = t.page_title;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t[el.dataset.i18n];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const v = t[el.dataset.i18nHtml];
    if (v !== undefined) el.innerHTML = v;
  });
  const langBtn = document.querySelector('.lang-btn');
  if (langBtn) langBtn.textContent = lang === 'zh' ? 'EN' : '中文';
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  localStorage.setItem('md-lang-v2', lang);
  if (lastBoard) render(lastBoard);
  if (lastStatusKind) setStatus(lastStatusKind, {ok:t.st_live, warn:t.st_stale, err:t.st_fail}[lastStatusKind]);
}
function toggleLang() {
  applyLang(curLang === 'zh' ? 'en' : 'zh');
}

const esc = s => (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function setStatus(cls,txt){
  const e=document.getElementById("status");
  e.className="live "+cls;
  e.innerHTML='<span class="dot"></span> '+txt;
}
function fmtDay(dateStr){
  const d=new Date(dateStr+"T00:00:00Z");
  return (curLang==='zh')
    ? (d.getUTCMonth()+1)+"/"+d.getUTCDate()
    : d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
}
function fmtGenerated(iso){
  const d=new Date(iso);
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
  const get=t=>parts.find(p=>p.type===t).value;
  const s=`${get('year')}-${get('month')}-${get('day')} ${get('hour')}:${get('minute')}`;
  return curLang==='zh' ? s+" 台北" : s+" Taipei";
}

function render(b){
  lastBoard=b;
  const L=T();
  const S=b.stats;
  const stats=[[L.stat_active,S.active_now?1:0,"#fb923c"],[L.stat_done7d,S.done_7d,"#34d399"],
    [L.stat_caps,S.capabilities_total,"#22d3ee"],[L.stat_selfheal,S.failed_7d,"#FFC74D"]]
    .map(([l,n,c])=>`<div class="stat"><div class="n" style="color:${c}">${n}</div>
      <div class="l">${l}</div></div>`).join("");

  const agents=b.agents.map(a=>{
    const meta=L.agents[a.key]||{emoji:"🤖",name:a.key,desc:""};
    const bc=a.status==="working"?"b-working":"b-idle";
    const bt=a.status==="working"?L.badge_working:L.badge_idle;
    return `<div class="agent" style="--ac:${a.accent}">
      <div class="top"><span class="emoji">${meta.emoji}</span>
        <div><div class="nm">${esc(meta.name)}</div><div class="ds">${esc(meta.desc)}</div></div>
        <span class="badge ${bc}">${bt}</span></div>
      <div class="tally"><span>${L.tally_done} <b>${a.done_7d}</b></span>
        ${a.failed_7d?`<span>${L.tally_selfheal} <b>${a.failed_7d}</b></span>`:""}</div>
    </div>`;
  }).join("");

  const days=b.activity_daily||[];
  const maxTotal=Math.max(1,...days.map(d=>d.total));
  const feed=days.length?days.map(d=>{
    const pct=Math.round(d.total/maxTotal*100);
    return `<div class="row"><span class="hash">${esc(fmtDay(d.date))}</span>
      <span class="msg"><span class="daybar" style="--w:${pct}%"></span></span>
      <span class="when">${d.total}${L.day_suffix}</span></div>`;
  }).join(""):`<div class="empty">${L.no_activity}</div>`;

  document.getElementById("body").innerHTML=
    `<div class="stats">${stats}</div>
     <h2 class="sec">${L.sec_team}</h2><div class="agents">${agents}</div>
     <h2 class="sec">${L.sec_activity}</h2><div class="feed">${feed}</div>`;
  document.getElementById("gen").textContent=L.generated_at+fmtGenerated(b.generated_utc);
}

async function load(){
  try{
    const r=await fetch(RAW+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json();
    render(data);
    const age=Date.now()-new Date(data.generated_utc).getTime();
    lastStatusKind = age>STALE_AFTER_MS?"warn":"ok";
    setStatus(lastStatusKind, lastStatusKind==="warn"?T().st_stale:T().st_live);
  }catch(e){
    lastStatusKind = "err";
    setStatus("err",T().st_fail);
    if(!document.querySelector(".stats"))
      document.getElementById("body").innerHTML=
        `<div class="skel">${T().err_prefix}${esc(e.message)}${T().err_suffix}</div>`;
  }
}
applyLang(curLang);
load();
setInterval(load,300000);
</script>
<script src="terminal.js?v=1"></script>
</body>
</html>

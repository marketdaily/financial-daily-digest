<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title data-i18n="pg_title">MarketDaily 看盤</title>
<style>
  :root{--bg:#0a0e1a;--card:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);
        --up:#ef4444;--down:#22c55e;--muted:#94a3b8;--ink:#e2e8f0;--indigo:#818cf8;--amber:#fde68a}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1e1b4b 0%,var(--bg) 55%);
       color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
       min-height:100vh;padding:24px 14px 60px}
  .wrap{max-width:760px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  h1{font-size:21px;font-weight:800;margin:0;letter-spacing:.5px}
  .back{color:var(--indigo);text-decoration:none;font-size:13px;font-weight:600}
  .sub{color:var(--muted);font-size:12px;margin:2px 0 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
             padding:2px 10px;border-radius:20px;border:1px solid var(--bd);color:var(--muted)}
  .src-badge.live{color:var(--amber);border-color:rgba(245,158,11,.38);background:rgba(245,158,11,.12)}
  .src-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .sec{margin-bottom:22px}
  .sec-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:1px;margin:0 0 8px;
             display:flex;justify-content:space-between;align-items:baseline}
  .cnt{font-size:11px;font-weight:600;color:rgba(255,255,255,.3)}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);
        border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
  th{font-size:11px;font-weight:700;color:var(--muted);text-align:right;padding:9px 10px;
     border-bottom:1px solid var(--bd);letter-spacing:.5px;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:9px 10px;font-size:14px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .nm{font-size:12px;color:var(--muted);display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .sym{font-weight:700}
  .px{font-weight:800;font-size:15px}
  .up{color:var(--up)} .down{color:var(--down)} .neutral{color:var(--muted)}
  .flash{animation:flash .6s}
  @keyframes flash{0%{background:rgba(129,140,248,.18)}100%{background:transparent}}
  .ext{display:none}
  .live-mode .ext{display:table-cell}
  .empty,.gate{padding:34px 20px;text-align:center;color:var(--muted);font-size:14px;
        background:var(--card);border:1px solid var(--bd);border-radius:14px}
  .gate a{color:var(--indigo);text-decoration:none;font-weight:700}
  .pos-card{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.22);border-radius:14px;
            padding:14px 16px;margin-bottom:22px}
  .pos-title{font-size:13px;font-weight:800;color:var(--amber);margin:0 0 8px}
  .pos-hint{font-size:12.5px;color:var(--muted);line-height:1.6}
  .foot{text-align:center;color:rgba(255,255,255,.25);font-size:11px;margin-top:26px;line-height:1.7}
  @media(max-width:560px){ td,th{padding:8px 6px} .px{font-size:14px} .hide-sm{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span data-i18n="pg_h1">📈 看盤</span></h1>
    <a class="back" href="dashboard.html" data-i18n="back_dash">← 回 Dashboard</a>
  </div>
  <p class="sub">
    <span class="src-badge" id="src-badge"><span class="dot"></span><span id="src-label" data-i18n="src_delayed">參考報價 · 15s 更新</span></span>
    <span class="cnt" id="tick-cnt"></span>
  </p>

  <div id="gate" class="gate" style="display:none">
    <span data-i18n="gate_msg">請先登入</span> <a href="dashboard.html" data-i18n="gate_link">前往 Dashboard →</a>
  </div>

  <div id="pos-wrap" style="display:none"></div>

  <div class="sec" id="tw-sec" style="display:none">
    <div class="sec-title"><span data-i18n="sec_tw">台股</span><span class="cnt" id="tw-cnt"></span></div>
    <table id="tw-table" class=""><thead><tr>
      <th data-i18n="col_sym">代號 / 名稱</th><th data-i18n="col_px">成交</th><th data-i18n="col_chg">漲跌</th>
      <th class="ext" data-i18n="col_bid">買進</th><th class="ext" data-i18n="col_ask">賣出</th>
      <th class="ext hide-sm" data-i18n="col_hl">高 / 低</th><th class="ext hide-sm" data-i18n="col_vol">量(張)</th>
    </tr></thead><tbody></tbody></table>
  </div>

  <div class="sec" id="us-sec" style="display:none">
    <div class="sec-title"><span data-i18n="sec_us">美股</span><span class="cnt" id="us-cnt"></span></div>
    <table id="us-table"><thead><tr>
      <th data-i18n="col_sym">代號 / 名稱</th><th data-i18n="col_px">成交</th><th data-i18n="col_chg">漲跌</th>
    </tr></thead><tbody></tbody></table>
  </div>

  <div id="empty" class="empty" style="display:none">
    <span data-i18n="empty_msg">尚未設定自選股。</span> <a href="dashboard.html?focus=stocks" style="color:var(--indigo);text-decoration:none;font-weight:700" data-i18n="empty_link">去新增 →</a>
  </div>

  <div class="foot" data-i18n-html="foot_note">報價僅供參考,非即時交易依據。個股資訊為系統自動彙整,不構成投資建議。</div>
</div>

<script src="stocks.js?v=20260528"></script>
<script>
const WORKER_URL = "https://api.marketdaily.ai";
const I18N = {
  zh: {
    pg_title:"MarketDaily 看盤", pg_h1:"📈 看盤", back_dash:"← 回 Dashboard",
    src_delayed:"參考報價 · 15s 更新", src_live:"永豐即時 · 5s", sec_tw:"台股", sec_us:"美股",
    col_sym:"代號 / 名稱", col_px:"成交", col_chg:"漲跌", col_bid:"買進", col_ask:"賣出", col_hl:"高 / 低", col_vol:"量(張)",
    gate_msg:"請先登入", gate_link:"前往 Dashboard →",
    empty_msg:"尚未設定自選股。", empty_link:"去新增 →",
    pos_title:"💼 我的部位", pos_unsigned:"帳戶尚未簽署 API 服務同意書,簽署後這裡會顯示真實持股部位與未實現損益。到永豐理財網 → API 申請頁完成線上簽署即可。",
    foot_note:"報價僅供參考,非即時交易依據。個股資訊為系統自動彙整,不構成投資建議。",
    limit_up:"🔥 漲停", limit_down:"❄️ 跌停",
    col_qty:"股數", col_avg:"均價", col_now:"現價", col_pnl:"損益"
  },
  en: {
    pg_title:"MarketDaily Watch", pg_h1:"📈 Watch", back_dash:"← Dashboard",
    src_delayed:"Reference quotes · 15s", src_live:"SinoPac real-time · 5s", sec_tw:"Taiwan", sec_us:"US",
    col_sym:"Symbol / Name", col_px:"Last", col_chg:"Chg", col_bid:"Bid", col_ask:"Ask", col_hl:"H / L", col_vol:"Vol",
    gate_msg:"Please sign in first.", gate_link:"Go to Dashboard →",
    empty_msg:"No watchlist yet.", empty_link:"Add stocks →",
    pos_title:"💼 My Positions", pos_unsigned:"Your brokerage account has not signed the API service agreement yet. Once signed, real positions and unrealized P&L will appear here.",
    foot_note:"Quotes are for reference only, not a basis for live trading. Stock information is auto-aggregated and is not investment advice.",
    limit_up:"🔥 Limit Up", limit_down:"❄️ Limit Down",
    col_qty:"Shares", col_avg:"Avg", col_now:"Last", col_pnl:"P&L"
  }
};
const LANG = (localStorage.getItem("md-lang-v2") || "zh");
const T = k => (I18N[LANG] || I18N.zh)[k] || I18N.zh[k] || k;
document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T(el.getAttribute("data-i18n")); });
document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = T(el.getAttribute("data-i18n-html")); });
document.title = T("pg_title");

const nameMap = new Map();
try { US_STOCKS_FULL.forEach(([s,n]) => nameMap.set(s,n)); TW_STOCKS_FULL.forEach(([s,n]) => nameMap.set(s,n)); } catch {}

const email = localStorage.getItem("md-email");
const pwd = sessionStorage.getItem("md-pwd") || localStorage.getItem("md-saved-pwd") || "";
const isAdmin = localStorage.getItem("md-plan") === "admin";
let twSyms = [], usSyms = [];
let bridge = null, bridgeFails = 0;
let freeTimer = null, liveTimer = null, posTimer = null;

function fmtChg(c, sym) {
  if (c === null || c === undefined) return { dir:"neutral", label:"—" };
  const isTW = /^\d{4,6}[A-Z]?$/.test(String(sym||""));
  if (isTW && c >= 9.9)  return { dir:"up",   label:T("limit_up") };
  if (isTW && c <= -9.9) return { dir:"down", label:T("limit_down") };
  return { dir: c >= 0 ? "up" : "down", label:`${c >= 0 ? "▲" : "▼"} ${Math.abs(c).toFixed(2)}%` };
}
const fp = v => v == null ? "—" : (v >= 1000 ? v.toLocaleString(undefined,{maximumFractionDigits:0}) : (v >= 100 ? v.toFixed(1) : v.toFixed(2)));

function rowHtml(sym) {
  const nm = nameMap.get(sym) || "";
  return `<tr id="r-${sym}"><td><span class="sym">${sym}</span><span class="nm">${nm}</span></td>
    <td class="px" id="px-${sym}">—</td><td id="chg-${sym}" class="neutral">—</td>
    <td class="ext" id="bid-${sym}">—</td><td class="ext" id="ask-${sym}">—</td>
    <td class="ext hide-sm" id="hl-${sym}">—</td><td class="ext hide-sm" id="vol-${sym}">—</td></tr>`;
}

function paint(q) {
  const s = q.symbol;
  const px = document.getElementById("px-"+s);
  if (!px) return;
  if (q.price == null && px.textContent !== "—") return;
  const prev = px.textContent;
  px.textContent = fp(q.price);
  const { dir, label } = fmtChg(q.change, s);
  px.className = "px " + dir;
  const chg = document.getElementById("chg-"+s);
  chg.textContent = label; chg.className = dir;
  if (q.bid !== undefined) {
    document.getElementById("bid-"+s).textContent = fp(q.bid);
    document.getElementById("ask-"+s).textContent = fp(q.ask);
    document.getElementById("hl-"+s).textContent = `${fp(q.high)} / ${fp(q.low)}`;
    document.getElementById("vol-"+s).textContent = q.volume == null ? "—" : q.volume.toLocaleString();
  }
  if (prev !== "—" && prev !== px.textContent) {
    const tr = document.getElementById("r-"+s);
    tr.classList.remove("flash"); void tr.offsetWidth; tr.classList.add("flash");
  }
}

async function fetchFree(syms) {
  const chunks = [];
  for (let i = 0; i < syms.length; i += 25) chunks.push(syms.slice(i, i+25));
  const parts = await Promise.all(chunks.map(c =>
    fetch(`${WORKER_URL}/stock-quotes?tickers=${c.join(",")}`).then(r=>r.json()).catch(()=>({quotes:[]}))
  ));
  return parts.flatMap(p => p.quotes || []);
}

async function tickFree() {
  // bridge 健康時台股走永豐即時;bridge 連續失敗 3 次改回免費源蓋台股,恢復後自動切回
  const syms = (bridge && bridgeFails < 3) ? usSyms : usSyms.concat(twSyms);
  if (!syms.length) return;
  (await fetchFree(syms)).forEach(paint);
}

async function tickLive() {
  if (!bridge || !twSyms.length) return;
  try {
    const r = await fetch(`${bridge.url}/q?syms=${twSyms.join(",")}&t=${encodeURIComponent(bridge.token)}`);
    if (!r.ok) throw new Error(r.status);
    (await r.json()).quotes.forEach(paint);
    bridgeFails = 0;
  } catch { bridgeFails++; }
}

async function tickPositions() {
  if (!bridge) return;
  try {
    const r = await fetch(`${bridge.url}/positions?t=${encodeURIComponent(bridge.token)}`);
    const d = await r.json();
    const wrap = document.getElementById("pos-wrap");
    wrap.style.display = "block";
    if (d.status === "not_signed") {
      wrap.innerHTML = `<div class="pos-card"><p class="pos-title">${T("pos_title")}</p><p class="pos-hint">${T("pos_unsigned")}</p></div>`;
      return;
    }
    if (d.status === "ok") {
      const rows = d.positions.map(p => {
        const dir = (p.pnl||0) >= 0 ? "up" : "down";
        const nm = nameMap.get(p.code) || "";
        return `<tr><td><span class="sym">${p.code}</span><span class="nm">${nm}</span></td>
          <td>${p.quantity}</td><td>${fp(p.avg_price)}</td><td class="px">${fp(p.last_price)}</td>
          <td class="${dir}">${(p.pnl||0) >= 0 ? "+" : ""}${Math.round(p.pnl||0).toLocaleString()}</td></tr>`;
      }).join("");
      wrap.innerHTML = `<div class="sec"><div class="sec-title"><span>${T("pos_title")}</span></div>
        <table><thead><tr><th>${T("col_sym")}</th><th>${T("col_qty")}</th><th>${T("col_avg")}</th><th>${T("col_now")}</th><th>${T("col_pnl")}</th></tr></thead>
        <tbody>${rows || ""}</tbody></table></div>`;
    }
  } catch {}
}

async function initBridge() {
  if (!isAdmin || !pwd) return;
  try {
    const cached = sessionStorage.getItem("md-watch-bridge");
    if (cached) { bridge = JSON.parse(cached); }
    else {
      const r = await fetch(WORKER_URL + "/watch-token", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ email, password: pwd }) });
      if (!r.ok) return;
      bridge = await r.json();
      sessionStorage.setItem("md-watch-bridge", JSON.stringify(bridge));
    }
    document.getElementById("tw-table").classList.add("live-mode");
    const badge = document.getElementById("src-badge");
    badge.classList.add("live");
    document.getElementById("src-label").textContent = T("src_live");
    tickLive(); tickPositions();
    liveTimer = setInterval(tickLive, 5000);
    posTimer = setInterval(tickPositions, 60000);
  } catch {}
}

async function init() {
  if (!email || !pwd) { document.getElementById("gate").style.display = "block"; return; }
  let data;
  try {
    const r = await fetch(WORKER_URL + "/get-preferences", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ email, password: pwd }) });
    data = await r.json();
    if (r.status === 403 || data.error) { document.getElementById("gate").style.display = "block"; return; }
  } catch { document.getElementById("gate").style.display = "block"; return; }
  twSyms = data.tw_stocks || [];
  usSyms = data.us_stocks || [];
  if (!twSyms.length && !usSyms.length) { document.getElementById("empty").style.display = "block"; return; }
  if (twSyms.length) {
    document.getElementById("tw-sec").style.display = "block";
    document.getElementById("tw-cnt").textContent = twSyms.length;
    document.querySelector("#tw-table tbody").innerHTML = twSyms.map(rowHtml).join("");
  }
  if (usSyms.length) {
    document.getElementById("us-sec").style.display = "block";
    document.getElementById("us-cnt").textContent = usSyms.length;
    document.querySelector("#us-table tbody").innerHTML = usSyms.map(rowHtml).join("");
  }
  tickFree();
  freeTimer = setInterval(tickFree, 15000);
  initBridge();
}
init();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { clearInterval(freeTimer); clearInterval(liveTimer); clearInterval(posTimer); freeTimer = liveTimer = posTimer = null; }
  else if (twSyms.length || usSyms.length) {
    tickFree(); freeTimer = setInterval(tickFree, 15000);
    if (bridge) { tickLive(); liveTimer = setInterval(tickLive, 5000); posTimer = setInterval(tickPositions, 60000); }
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title data-i18n="pg_title">MarketDaily 看盤</title>
<style>
  :root{--bg:#0a0e1a;--card:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);
        --up:#ef4444;--down:#22c55e;--muted:#94a3b8;--ink:#e2e8f0;--indigo:#818cf8;--amber:#fde68a}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1e1b4b 0%,var(--bg) 55%);
       color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
       min-height:100vh;padding:20px 14px 80px}
  .wrap{max-width:820px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  h1{font-size:21px;font-weight:800;margin:0;letter-spacing:.5px}
  .back{color:var(--indigo);text-decoration:none;font-size:13px;font-weight:600}
  .sub{color:var(--muted);font-size:12px;margin:2px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
             padding:2px 10px;border-radius:20px;border:1px solid var(--bd);color:var(--muted)}
  .src-badge.live{color:var(--amber);border-color:rgba(245,158,11,.38);background:rgba(245,158,11,.12)}
  .src-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .searchbox{position:relative;margin-bottom:12px}
  .searchbox input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);
    background:rgba(255,255,255,.05);color:var(--ink);font-size:14px;outline:none}
  .searchbox input:focus{border-color:rgba(129,140,248,.5)}
  .sr-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;background:#141a2e;
    border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none}
  .sr-item{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;font-size:13.5px;cursor:pointer}
  .sr-item:hover{background:rgba(129,140,248,.12)}
  .sr-item .c{font-weight:800}.sr-item .n{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--muted);
       font-size:13px;font-weight:700;cursor:pointer}
  .tab.on{background:rgba(129,140,248,.16);border-color:rgba(129,140,248,.45);color:#c7d2fe}
  .chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .chip{padding:5px 12px;border-radius:16px;border:1px solid var(--bd);background:transparent;color:var(--muted);
        font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip.on{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.4);color:var(--amber)}
  select.catsel{padding:7px 12px;border-radius:12px;border:1px solid var(--bd);background:#141a2e;color:var(--ink);
        font-size:13px;font-weight:600;outline:none;max-width:100%}
  .sec{margin-bottom:20px}
  .sec-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:1px;margin:0 0 8px;
             display:flex;justify-content:space-between;align-items:baseline}
  .cnt{font-size:11px;font-weight:600;color:rgba(255,255,255,.3)}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);
        border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
  th{font-size:11px;font-weight:700;color:var(--muted);text-align:right;padding:9px 8px;
     border-bottom:1px solid var(--bd);letter-spacing:.5px;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:9px 8px;font-size:14px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  .nm{font-size:11.5px;color:var(--muted);display:block;max-width:140px;overflow:hidden;text-overflow:ellipsis}
  .sym{font-weight:700}
  .sig-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .sig-dot.red{background:#ef4444;box-shadow:0 0 6px #ef4444}
  .sig-dot.yellow{background:#f59e0b;box-shadow:0 0 6px #f59e0b}
  .ind-tag{font-size:10px;color:rgba(255,255,255,.35);margin-left:6px;font-weight:600}
  .px{font-weight:800;font-size:15px}
  .up{color:var(--up)} .down{color:var(--down)} .neutral{color:var(--muted)}
  .flash{animation:flash .6s}
  @keyframes flash{0%{background:rgba(129,140,248,.18)}100%{background:transparent}}
  .ext{display:none}
  .live-mode .ext{display:table-cell}
  .empty,.gate{padding:34px 20px;text-align:center;color:var(--muted);font-size:14px;
        background:var(--card);border:1px solid var(--bd);border-radius:14px}
  .gate a,.empty a{color:var(--indigo);text-decoration:none;font-weight:700}
  .pos-card{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.22);border-radius:14px;
            padding:14px 16px;margin-bottom:18px}
  .pos-title{font-size:13px;font-weight:800;color:var(--amber);margin:0 0 8px}
  .pos-hint{font-size:12.5px;color:var(--muted);line-height:1.6}
  .more-btn{display:block;margin:10px auto 0;padding:8px 22px;border-radius:20px;border:1px solid var(--bd);
        background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
  .foot{text-align:center;color:rgba(255,255,255,.25);font-size:11px;margin-top:26px;line-height:1.7}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#12182b;border-radius:20px 20px 0 0;
         border:1px solid var(--bd);border-bottom:none;padding:18px 18px 30px;display:none;max-height:72vh;overflow-y:auto}
  .sheet.open,.sheet-bg.open{display:block}
  .sheet h3{margin:0 0 2px;font-size:18px}
  .sheet .s-ind{font-size:12px;color:var(--muted);margin-bottom:12px}
  .sheet .s-q{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted)}
  .sheet .s-q b{color:var(--ink);font-variant-numeric:tabular-nums}
  .sig-item{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:10px;
            padding:9px 12px;font-size:12.5px;line-height:1.55;margin-bottom:8px}
  .sig-item .src{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.5px}
  .g-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .g-title{font-size:12px;font-weight:700;color:var(--muted);margin-top:14px}
  @media(max-width:560px){ td,th{padding:8px 5px} .px{font-size:14px} .hide-sm{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span data-i18n="pg_h1">📈 看盤</span></h1>
    <a class="back" href="dashboard.html" data-i18n="back_dash">← 回 Dashboard</a>
  </div>
  <p class="sub">
    <span class="src-badge" id="src-badge"><span class="dot"></span><span id="src-label" data-i18n="src_delayed">參考報價 · 15s 更新</span></span>
  </p>

  <div id="gate" class="gate" style="display:none">
    <span data-i18n="gate_msg">請先登入</span> <a href="dashboard.html" data-i18n="gate_link">前往 Dashboard →</a>
  </div>

  <div id="app" style="display:none">
    <div class="searchbox">
      <input id="search" autocomplete="off" data-i18n-placeholder="search_ph" placeholder="搜尋任何股票:代號或名稱(台股+美股)…">
      <div class="sr-drop" id="sr-drop"></div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="watch" data-i18n="tab_watch">⭐ 自選</button>
      <button class="tab" data-tab="cats" data-i18n="tab_cats">🗂 分類</button>
      <button class="tab" data-tab="ranks" id="tab-ranks" style="display:none" data-i18n="tab_ranks">🏆 排行</button>
    </div>

    <div class="chips" id="group-chips" style="display:none"></div>
    <div class="chips" id="cat-bar" style="display:none">
      <select class="catsel" id="cat-sel"></select>
    </div>
    <div class="chips" id="rank-chips" style="display:none"></div>

    <div id="pos-wrap" style="display:none"></div>

    <div class="sec" id="tw-sec" style="display:none">
      <div class="sec-title"><span data-i18n="sec_tw">台股</span><span class="cnt" id="tw-cnt"></span></div>
      <table id="tw-table"><thead><tr>
        <th data-i18n="col_sym">代號 / 名稱</th><th data-i18n="col_px">成交</th><th data-i18n="col_chg">漲跌</th>
        <th class="ext" data-i18n="col_bid">買進</th><th class="ext" data-i18n="col_ask">賣出</th>
        <th class="ext hide-sm" data-i18n="col_hl">高 / 低</th><th class="ext hide-sm" data-i18n="col_vol">量(張)</th>
      </tr></thead><tbody></tbody></table>
      <button class="more-btn" id="tw-more" style="display:none" data-i18n="more">顯示更多 ↓</button>
    </div>

    <div class="sec" id="us-sec" style="display:none">
      <div class="sec-title"><span data-i18n="sec_us">美股</span><span class="cnt" id="us-cnt"></span></div>
      <table id="us-table"><thead><tr>
        <th data-i18n="col_sym">代號 / 名稱</th><th data-i18n="col_px">成交</th><th data-i18n="col_chg">漲跌</th>
      </tr></thead><tbody></tbody></table>
    </div>

    <div class="sec" id="rank-sec" style="display:none">
      <div class="sec-title"><span id="rank-title"></span><span class="cnt" data-i18n="rank_src">永豐即時 · 30s</span></div>
      <table id="rank-table"><thead><tr>
        <th>#</th><th data-i18n="col_sym">代號 / 名稱</th><th data-i18n="col_px">成交</th><th data-i18n="col_chg">漲跌</th>
        <th class="hide-sm" data-i18n="col_vol">量(張)</th>
      </tr></thead><tbody></tbody></table>
    </div>

    <div id="empty" class="empty" style="display:none">
      <span data-i18n="empty_msg">這個清單目前是空的。</span> <a href="dashboard.html?focus=stocks" data-i18n="empty_link">去新增自選 →</a>
    </div>
  </div>

  <div class="foot" data-i18n-html="foot_note">報價僅供參考,非即時交易依據。個股資訊與訊號為系統自動彙整,不構成投資建議。</div>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"></div>

<script src="stocks.js?v=20260528"></script>
<script src="tw-industry.js?v=20260722"></script>
<script src="js/watch.js?v=20260722"></script>
</body>
</html>

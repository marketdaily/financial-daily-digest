<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>MarketDaily 系統狀態</title>
<style>
  :root{--bg:#0a0e1a;--card:rgba(255,255,255,.04);--bd:rgba(255,255,255,.08);
        --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--muted:#94a3b8;--ink:#e2e8f0;--indigo:#818cf8}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1e1b4b 0%,var(--bg) 55%);
       color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
       min-height:100vh;padding:32px 16px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 24px}
  .overall{display:flex;align-items:center;gap:12px;padding:18px 20px;border-radius:16px;
           background:var(--card);border:1px solid var(--bd);margin-bottom:18px}
  .overall .dot{width:14px;height:14px;border-radius:50%}
  .overall b{font-size:17px}
  .card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;
        background:var(--card);border:1px solid var(--bd);margin-bottom:10px}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 10px currentColor}
  .dot.ok{background:var(--ok);color:var(--ok)} .dot.warn{background:var(--warn);color:var(--warn)}
  .dot.bad{background:var(--bad);color:var(--bad)} .dot.pend{background:var(--muted);color:var(--muted)}
  .meta{flex:1;min-width:0}
  .meta .name{font-size:15px;font-weight:600}
  .meta .desc{font-size:12px;color:var(--muted);margin-top:2px}
  .st{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.pend{color:var(--muted)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
  a{color:var(--indigo);text-decoration:none}
  .sec{font-size:16px;font-weight:700;margin:26px 0 10px;letter-spacing:.4px}
  .qnote{display:none;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:13px;
         background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pg-h1">🩺 MarketDaily 系統狀態</h1>
  <p class="sub" id="pg-sub">前台用戶可見的核心管線即時健康度 · 每 60 秒自動更新</p>
  <div class="overall" id="overall">
    <span class="dot pend" id="ov-dot"></span>
    <b id="ov-text">檢查中…</b>
  </div>
  <div id="cards"></div>
  <h2 class="sec" id="k-h2"></h2>
  <div id="k-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:6px"></div>
  <h2 class="sec" id="q-h2"></h2>
  <div class="qnote" id="q-note"></div>
  <div id="q-cards"></div>
  <div class="foot"><span id="foot-last">最後檢查:</span><span id="ts">—</span> · <a href="/" id="foot-home">回首頁</a></div>
</div>
<script>
const WORKER = "https://api.marketdaily.ai";
const pad = n => String(n).padStart(2,"0");
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}

// 全站雙語一致:尊重使用者在其他頁設定的語言偏好(md-lang-v2),EN 時整頁英文渲染。
const LANG = (localStorage.getItem("md-lang-v2") === "en") ? "en" : "zh";
const I18N = {
  zh: {
    title:"🩺 MarketDaily 系統狀態", sub:"前台用戶可見的核心管線即時健康度 · 每 60 秒自動更新",
    checking:"檢查中…", checking_st:"檢查中", last:"最後檢查:", home:"回首頁",
    st:{ok:"正常",warn:"注意",bad:"異常"},
    ov:{ok:"全部系統正常",warn:"部分系統需注意",bad:"偵測到系統異常"},
    checks:[
      {name:"網站前台", desc:"marketdaily.ai 可正常載入"},
      {name:"即時報價 API", desc:"美股 + 台股報價回傳"},
      {name:"戰績資料", desc:"track-record.json 持續刷新"},
      {name:"公版日報存檔", desc:"每日日報網頁版產出"},
    ],
    note:{
      page_ok:"頁面已載入",
      quotes:(n)=>`${n}/2 支有報價`, quotes_one:"僅 1 支有報價", quotes_none:"報價無回傳",
      tr_none:"無更新時間戳", tr_ok:(w)=>`更新於 ${w}`, tr_old:(w)=>`偏舊(${w})`, tr_bad:(w)=>`過期(${w})`,
      hrs_ago:(h)=>`${h}h 前`,
      digest_ok:(d)=>`最新 ${d}`, digest_none:"近 2 日無存檔",
      check_fail:"檢查失敗",
    },
  },
  en: {
    title:"🩺 MarketDaily System Status", sub:"Live health of the user-facing core pipeline · auto-refreshes every 60s",
    checking:"Checking…", checking_st:"Checking", last:"Last checked: ", home:"Home",
    st:{ok:"Operational",warn:"Warning",bad:"Down"},
    ov:{ok:"All systems operational",warn:"Some systems need attention",bad:"System issue detected"},
    checks:[
      {name:"Website front-end", desc:"marketdaily.ai loads normally"},
      {name:"Live quotes API", desc:"US + TW quotes returning"},
      {name:"Track record data", desc:"track-record.json keeps refreshing"},
      {name:"Public digest archive", desc:"daily digest web version published"},
    ],
    note:{
      page_ok:"Page loaded",
      quotes:(n)=>`${n}/2 quotes live`, quotes_one:"only 1 quote live", quotes_none:"no quotes returned",
      tr_none:"no timestamp", tr_ok:(w)=>`updated ${w}`, tr_old:(w)=>`stale (${w})`, tr_bad:(w)=>`expired (${w})`,
      hrs_ago:(h)=>`${h}h ago`,
      digest_ok:(d)=>`latest ${d}`, digest_none:"no archive in last 2 days",
      check_fail:"check failed",
    },
  },
};
const T = I18N[LANG];
document.documentElement.lang = LANG === "en" ? "en" : "zh-Hant";
document.getElementById("pg-h1").textContent = T.title;
document.getElementById("pg-sub").textContent = T.sub;
document.getElementById("ov-text").textContent = T.checking;
document.getElementById("foot-last").textContent = T.last;
document.getElementById("foot-home").textContent = T.home;

const CHECKS = [
  { run: async () => ({state:"ok", note:T.note.page_ok}) },
  { run: async () => {
      const r = await fetch(`${WORKER}/stock-quotes?tickers=2330,AAPL`,{cache:"no-store"});
      const j = await r.json();
      const q = (j.quotes||[]).filter(x=>x && (x.price>0));
      if(q.length>=2) return {state:"ok", note:T.note.quotes(q.length)};
      if(q.length===1) return {state:"warn", note:T.note.quotes_one};
      return {state:"bad", note:T.note.quotes_none};
    } },
  { run: async () => {
      const r = await fetch(`/data/track-record.json?t=${Date.now()}`,{cache:"no-store"});
      const j = await r.json();
      const g = j.generated_at || j.generatedAt || (j.stats && j.stats.generated_at);
      if(!g) return {state:"warn", note:T.note.tr_none};
      const hrs = (Date.now() - new Date(g).getTime())/3.6e6;
      const when = T.note.hrs_ago(Math.round(hrs));
      if(hrs<36) return {state:"ok", note:T.note.tr_ok(when)};
      if(hrs<60) return {state:"warn", note:T.note.tr_old(when)};
      return {state:"bad", note:T.note.tr_bad(when)};
    } },
  { run: async () => {
      const today = new Date(), y = new Date(Date.now()-864e5);
      for(const d of [today,y]){
        const r = await fetch(`/output/digest_${ymd(d)}.html`,{method:"HEAD",cache:"no-store"});
        if(r.ok) return {state:"ok", note:T.note.digest_ok(ymd(d))};
      }
      return {state:"warn", note:T.note.digest_none};
    } },
];

const order = {ok:0, warn:1, bad:2, pend:3};
async function runAll(){
  const box = document.getElementById("cards");
  box.innerHTML = "";
  const cards = CHECKS.map((c,i)=>{
    const el = document.createElement("div"); el.className="card";
    el.innerHTML = `<span class="dot pend"></span><div class="meta">
      <div class="name">${T.checks[i].name}</div><div class="desc">${T.checks[i].desc}</div></div>
      <span class="st pend">${T.checking_st}</span>`;
    box.appendChild(el); return el;
  });
  const results = await Promise.all(CHECKS.map(async (c,i)=>{
    let res; try{ res = await c.run(); }catch(e){ res={state:"bad", note:T.note.check_fail}; }
    const el = cards[i];
    el.querySelector(".dot").className = "dot "+res.state;
    const st = el.querySelector(".st"); st.className="st "+res.state;
    st.textContent = T.st[res.state]||"—";
    el.querySelector(".desc").textContent = res.note;
    return res.state;
  }));
  const worst = results.reduce((a,b)=> order[b]>order[a]?b:a, "ok");
  document.getElementById("ov-dot").className = "dot "+worst;
  document.getElementById("ov-text").textContent = T.ov[worst];
  const d = new Date();
  document.getElementById("ts").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
// ── 🛡 品質戰情室(品質監察部,2026-07-29 組織化)──
// 資料源①watchdog /status(雲端外部視角,winrig 死也活著)②/data/quality.json(winrig 彙整,
// build_quality_board.py 產出,只含彙整數字/enum)。winrig 心跳 stale → 本地資料視為凍結,整段示警。
const QT = {
  zh: {
    title:"🛡 品質戰情室(品質監察部)",
    frozen:"⚠️ winrig 心跳過期——以下本地防線資料可能已凍結(watchdog 外部視角仍為即時)",
    cards:{
      wd:{name:"雲端守望 watchdog", desc:"存檔上線+winrig 心跳(外部視角)"},
      gate:{name:"寄前品質閘", desc:"audit 失分/確定性備援"},
      time:{name:"班次準時度", desc:"07:00/20:00 整點交付"},
      heal:{name:"寄後自癒+複檢", desc:"selfheal 裁決/postcheck"},
      scan:{name:"站點巡檢", desc:"site_scan 每朝掃描"},
    },
    v:{on_time:"準時",late:"遲到",degenerate_429:"429退化",skipped:"跳過",incomplete:"未完成"},
    sh:{none:"無需修",apply:"已自動修",blocked_scope:"修被擋(scope)",blocked_tests:"修被擋(測試)"},
    nodata:"今日尚無資料", noconn:"無法連線", killsw:"⚠ kill-switch 啟用中",
    gateNote:(a,top)=>`${a.date} 失分 ${a.audit_failed}/${a.total_subscribers} · 備援 ${a.fallback}`+(top?` · top:${top}`:""),
    scanNote:(sc)=>`${sc.date} fail ${sc.fails}`+(sc.fixed_in_place?` (首掃 ${sc.first_scan_fails}→已自動修)`:""),
  },
  en: {
    title:"🛡 Quality War Room (QA Dept.)",
    frozen:"⚠️ winrig heartbeat stale — local defense data below may be frozen (watchdog view stays live)",
    cards:{
      wd:{name:"Cloud watchdog", desc:"archive + winrig heartbeat (external view)"},
      gate:{name:"Pre-send quality gate", desc:"audit fails / deterministic fallbacks"},
      time:{name:"Shift punctuality", desc:"07:00/20:00 on-the-hour delivery"},
      heal:{name:"Post-send selfheal + recheck", desc:"selfheal verdict / postcheck"},
      scan:{name:"Site scan", desc:"daily site_scan sweep"},
    },
    v:{on_time:"on time",late:"late",degenerate_429:"429 degraded",skipped:"skipped",incomplete:"incomplete"},
    sh:{none:"nothing to fix",apply:"auto-fixed",blocked_scope:"fix blocked (scope)",blocked_tests:"fix blocked (tests)"},
    nodata:"no data yet today", noconn:"unreachable", killsw:"⚠ kill-switch ON",
    gateNote:(a,top)=>`${a.date} fails ${a.audit_failed}/${a.total_subscribers} · fallback ${a.fallback}`+(top?` · top:${top}`:""),
    scanNote:(sc)=>`${sc.date} fails ${sc.fails}`+(sc.fixed_in_place?` (1st scan ${sc.first_scan_fails} → auto-fixed)`:""),
  },
}[LANG];
document.getElementById("q-h2").textContent = QT.title;

const KT = {
  zh:{title:"📊 公司 KPI", subs:"訂閱者", clean:"7日日報達標天數(失分≤2)", fb:"7日備援次數", posts:"7日社群發文"},
  en:{title:"📊 Company KPI", subs:"Subscribers", clean:"Clean digest days (7d)", fb:"Fallbacks (7d)", posts:"Social posts (7d)"},
}[LANG];
document.getElementById("k-h2").textContent = KT.title;
function renderKpi(k){
  const box = document.getElementById("k-cards"); box.innerHTML = "";
  const items = [[k.subscribers, KT.subs], [k.digest_clean_days_7d, KT.clean],
                 [k.fallback_7d, KT.fb], [k.social_posts_7d, KT.posts]];
  for(const [v, label] of items){
    if(v === undefined || v === null) continue;
    const el = document.createElement("div");
    el.style.cssText = "background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px";
    el.innerHTML = `<div style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">${v}</div>
      <div style="font-size:11px;color:var(--muted)">${label}</div>`;
    box.appendChild(el);
  }
}

function qCard(box, key){
  const el = document.createElement("div"); el.className="card";
  el.innerHTML = `<span class="dot pend"></span><div class="meta">
    <div class="name">${QT.cards[key].name}</div><div class="desc">${QT.cards[key].desc}</div></div>
    <span class="st pend">${T.checking_st}</span>`;
  box.appendChild(el);
  return (state, note)=>{
    el.querySelector(".dot").className = "dot "+state;
    const st = el.querySelector(".st"); st.className="st "+state;
    st.textContent = T.st[state] || "—";
    if(note) el.querySelector(".desc").textContent = note;
  };
}

async function runQuality(){
  const box = document.getElementById("q-cards"); box.innerHTML = "";
  const set = {wd:qCard(box,"wd"), gate:qCard(box,"gate"), time:qCard(box,"time"),
               heal:qCard(box,"heal"), scan:qCard(box,"scan")};
  const [wdR, qR] = await Promise.allSettled([
    fetch("https://watchdog.marketdaily.ai/status",{cache:"no-store"}).then(r=>r.json()),
    fetch("/data/quality.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()),
  ]);
  let frozen = false;
  if(wdR.status==="fulfilled"){
    const w = wdR.value, arc = s => (w[s]&&w[s].skipped) ? "—" : (w[s]&&w[s].archived ? "✓" : "✗");
    const hbTxt = w.hb.ageMin==null ? "?" : w.hb.ageMin+"m";
    frozen = !!w.hb.stale;
    const missing = ["tw","us"].some(s => w[s] && !w[s].skipped && !w[s].archived && !w[s].error);
    set.wd(w.hb.stale ? "bad" : (missing ? "warn" : "ok"),
           `TW ${arc("tw")} · US ${arc("us")} · HB ${hbTxt}`);
  } else set.wd("bad", QT.noconn);
  document.getElementById("q-note").style.display = frozen ? "block" : "none";
  document.getElementById("q-note").textContent = QT.frozen;
  if(qR.status!=="fulfilled"){
    set.gate("warn", QT.noconn); set.time("warn", QT.noconn);
    set.heal("warn", QT.noconn); set.scan("warn", QT.noconn);
    return;
  }
  const q = qR.value, soft = s => frozen ? "warn" : s;
  if(q.kpi) renderKpi(q.kpi);
  const a = q.digest && q.digest.audit;
  if(a){
    const top = Object.keys(a.per_check||{})[0];
    const bad = a.fallback>0 || (a.total_subscribers>0 && a.audit_failed/a.total_subscribers>0.5);
    set.gate(soft(bad ? "warn" : "ok"), QT.gateNote(a, top));
  } else set.gate(soft("warn"), QT.nodata);
  const today = (q.digest && q.digest.shifts || []).filter(s=>s.date===q.date);
  if(today.length){
    const txt = today.map(s=>`${s.market} ${QT.v[s.verdict]||s.verdict}${s.lateness_min>2?`(+${Math.round(s.lateness_min)}m)`:""}`).join(" · ");
    const worstBad = today.some(s=>["late","degenerate_429","incomplete"].includes(s.verdict));
    set.time(soft(worstBad ? "warn" : "ok"), txt);
  } else set.time(soft("warn"), QT.nodata);
  const shTxt = ["tw","us"].map(ed=>{
    const v = q.selfheal && q.selfheal[ed];
    return `${ed}:${v ? (QT.sh[v]||v) : "—"}/pc:${q.postcheck && q.postcheck[ed]!=null ? q.postcheck[ed] : "—"}`;
  }).join(" · ");
  const healBad = ["tw","us"].some(ed=>(q.postcheck&&q.postcheck[ed]!=null&&q.postcheck[ed]!==0) ||
                                        (q.selfheal&&String(q.selfheal[ed]||"").startsWith("blocked")));
  set.heal(soft(healBad ? "warn" : "ok"), (q.selfheal&&q.selfheal.disabled ? QT.killsw+" · " : "") + shTxt);
  const sc = q.sitescan;
  if(sc && sc.fails!=null){
    set.scan(soft(sc.fails>0 ? "warn" : "ok"), QT.scanNote(sc));
  } else set.scan(soft("warn"), sc ? `${sc.date} ?` : QT.nodata);
}

function tick(){ runAll(); runQuality(); }
tick(); setInterval(tick, 60000);
</script>
</body>
</html>

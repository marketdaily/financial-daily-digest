<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重設密碼 · MarketDaily</title>
<link rel="icon" type="image/svg+xml" href="/logo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060611;
  --border2: rgba(255,255,255,0.13);
  --primary: #6366f1;
  --primary-light: #818cf8;
  --violet: #8b5cf6;
  --text: #f1f5f9;
  --text2: rgba(255,255,255,0.5);
  --text3: rgba(255,255,255,0.28);
  --input-bg: rgba(255,255,255,0.06);
  --input-border: rgba(255,255,255,0.11);
  --radius-sm: 10px;
  --radius-lg: 22px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; border-radius: 4px; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 60% at 50% 40%, rgba(99,102,241,0.14) 0%, transparent 70%),
    linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
  background-size: 100% 100%, 72px 72px, 72px 72px;
  pointer-events: none;
}
.login-wrap { position: relative; z-index: 1; width: 100%; max-width: 420px; }
.login-card {
  background: rgba(13,13,26,0.95); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); padding: 44px 40px;
  box-shadow: 0 40px 96px rgba(0,0,0,0.7), 0 0 0 1px rgba(99,102,241,0.08);
}
.login-logo {
  font-size: 24px; font-weight: 900; letter-spacing: -1px; text-align: center; margin-bottom: 4px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.login-logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--primary), var(--violet));
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}
.login-logo em { color: var(--primary-light); font-style: normal; }
.login-sub { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 32px; margin-top: 4px; }
.login-label { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 7px; letter-spacing: 0.3px; }
.login-input {
  width: 100%; padding: 13px 16px; background: var(--input-bg);
  border: 1px solid var(--input-border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit; color: var(--text); outline: none;
  transition: all 0.2s; margin-bottom: 16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
}
.login-input:focus { border-color: var(--primary); background: rgba(99,102,241,0.08); box-shadow: 0 0 0 3px rgba(99,102,241,0.16); }
.login-input::placeholder { color: var(--text3); }
.login-btn {
  width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none;
  border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all 0.22s;
  box-shadow: 0 4px 20px rgba(99,102,241,0.42), inset 0 1px 0 rgba(255,255,255,0.1);
}
.login-btn:hover { background: #4f46e5; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(99,102,241,0.52); }
.login-btn:active { transform: translateY(0); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.login-err { font-size: 13px; color: #f87171; margin-top: 12px; display: none; text-align: center; line-height: 1.7; }
.login-ok { font-size: 13px; color: #6ee7b7; margin-top: 12px; display: none; text-align: center; line-height: 1.7; }
.login-hint { font-size: 12px; color: var(--text3); margin-top: 20px; text-align: center; line-height: 1.8; }
.login-hint a { color: var(--primary-light); font-weight: 700; text-decoration: none; }
.login-hint a:hover { color: #fff; }
.pwd-rule { font-size: 12px; color: var(--text3); margin: -6px 0 16px; line-height: 1.7; }
.pwd-wrap { position: relative; }
.pwd-wrap .login-input { padding-right: 44px; }
.pwd-eye {
  position: absolute; right: 6px; top: 0; height: 45px; width: 38px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; color: var(--text3); padding: 0;
}
.pwd-eye:hover { color: var(--text2); }
.pwd-eye .eye-off { display: none; }
.pwd-eye.showing .eye-on { display: none; }
.pwd-eye.showing .eye-off { display: block; }
.success-icon { font-size: 44px; text-align: center; margin-bottom: 14px; }
@media (max-width: 480px) { .login-card { padding: 32px 24px; } }
</style>
<link rel="stylesheet" href="terminal.css?v=1">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="16" height="16" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="14" width="4" height="7" rx="1.5" fill="white" fill-opacity="0.55"/>
          <rect x="7" y="9" width="4" height="12" rx="1.5" fill="white" fill-opacity="0.78"/>
          <rect x="13" y="4" width="4" height="17" rx="1.5" fill="white"/>
          <circle cx="20" cy="3" r="2" fill="#fde68a"/>
        </svg>
      </div>
      Market<em>Daily</em>
    </div>

    <!-- 申請重設連結 -->
    <div id="request-view" style="display:none;">
      <div class="login-sub" data-t="req_sub"></div>
      <label class="login-label" for="fp-email" data-t="req_email_label"></label>
      <input type="email" class="login-input" id="fp-email" placeholder="your@email.com" autocomplete="email" onkeydown="if(event.key==='Enter')requestReset()">
      <button class="login-btn" id="fp-btn" onclick="requestReset()" data-t="req_btn"></button>
      <div class="login-ok" id="fp-ok"></div>
      <div class="login-err" id="fp-err"></div>
      <div class="login-hint"><a href="dashboard.html" data-t="back_login"></a></div>
    </div>

    <!-- 設定新密碼 -->
    <div id="reset-view" style="display:none;">
      <div class="login-sub" data-t="rst_sub"></div>
      <label class="login-label" for="rp-new" data-t="rst_new_label"></label>
      <div class="pwd-wrap">
        <input type="password" class="login-input" id="rp-new" autocomplete="new-password">
        <button type="button" class="pwd-eye" onclick="togglePwd('rp-new', this)" tabindex="-1" aria-label="顯示密碼"><svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
      </div>
      <label class="login-label" for="rp-confirm" data-t="rst_confirm_label"></label>
      <div class="pwd-wrap">
        <input type="password" class="login-input" id="rp-confirm" autocomplete="new-password" onkeydown="if(event.key==='Enter')doReset()">
        <button type="button" class="pwd-eye" onclick="togglePwd('rp-confirm', this)" tabindex="-1" aria-label="顯示密碼"><svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
      </div>
      <div class="pwd-rule" data-t="rst_rule"></div>
      <button class="login-btn" id="rp-btn" onclick="doReset()" data-t="rst_btn"></button>
      <div class="login-err" id="rp-err"></div>
      <div class="login-hint"><a href="reset-password.html" data-t="req_again"></a></div>
    </div>

    <!-- 完成 -->
    <div id="done-view" style="display:none;">
      <div class="success-icon">✅</div>
      <div class="login-sub" data-t="done_sub"></div>
      <a class="login-btn" href="dashboard.html" style="display:block;text-align:center;text-decoration:none;" data-t="done_btn"></a>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://marketdaily-webhook.delvin-12345678.workers.dev";
const LANG = localStorage.getItem("md-lang-v2") || "zh";
const I18N = {
  zh: {
    req_sub: "忘記密碼？輸入你的訂閱 Email，我們會寄一封重設連結給你",
    req_email_label: "訂閱 Email",
    req_btn: "寄送重設連結 →",
    req_sent: "如果這個 Email 有 MarketDaily 帳號，重設連結已寄出（30 分鐘內有效）。沒收到的話，檢查一下垃圾信件匣。",
    back_login: "← 返回登入",
    req_again: "連結失效？重新申請 →",
    rst_sub: "設定你的新密碼",
    rst_new_label: "新密碼",
    rst_confirm_label: "確認新密碼",
    rst_rule: "至少 10 個字元，並包含至少兩種字元類型（大寫、小寫、數字、符號）",
    rst_btn: "設定新密碼 →",
    done_sub: "密碼已更新！現在可以用新密碼登入了",
    done_btn: "前往登入 →",
    err_invalid_email: "請輸入有效的 Email",
    err_mismatch: "兩次輸入的密碼不一致",
    err_too_short: "密碼至少需要 10 個字元",
    err_too_long: "密碼太長了",
    err_too_weak: "密碼太常見或字元種類不足，請混用大小寫、數字或符號",
    err_invalid_token: "這個重設連結無效或已過期，請重新申請",
    err_too_many_attempts: "嘗試次數過多，請 1 小時後再試",
    err_network: "網路錯誤，請稍後再試",
  },
  en: {
    req_sub: "Forgot your password? Enter your email and we'll send you a reset link",
    req_email_label: "Email",
    req_btn: "Send reset link →",
    req_sent: "If this email has a MarketDaily account, a reset link is on its way (valid for 30 minutes). Check your spam folder if you don't see it.",
    back_login: "← Back to login",
    req_again: "Link expired? Request a new one →",
    rst_sub: "Set your new password",
    rst_new_label: "New password",
    rst_confirm_label: "Confirm new password",
    rst_rule: "At least 10 characters, with at least two character types (uppercase, lowercase, digits, symbols)",
    rst_btn: "Set new password →",
    done_sub: "Password updated! You can now log in with your new password",
    done_btn: "Go to login →",
    err_invalid_email: "Please enter a valid email",
    err_mismatch: "Passwords don't match",
    err_too_short: "Password must be at least 10 characters",
    err_too_long: "Password is too long",
    err_too_weak: "Password is too common or too simple — mix uppercase, lowercase, digits or symbols",
    err_invalid_token: "This reset link is invalid or has expired. Please request a new one",
    err_too_many_attempts: "Too many attempts. Please try again in an hour",
    err_network: "Network error, please try again later",
  },
};
function T(k) { return (I18N[LANG] && I18N[LANG][k]) || I18N.zh[k] || k; }
function togglePwd(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  const show = inp.type === "password";
  inp.type = show ? "text" : "password";
  btn.classList.toggle("showing", show);
  btn.setAttribute("aria-label", show ? "隱藏密碼" : "顯示密碼");
}
document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T(el.dataset.t); });
if (LANG === "en") document.documentElement.lang = "en";

const token = new URLSearchParams(location.search).get("token") || "";
document.getElementById(/^[a-f0-9]{64}$/.test(token) ? "reset-view" : "request-view").style.display = "block";

async function requestReset() {
  const email = document.getElementById("fp-email").value.trim().toLowerCase();
  const errEl = document.getElementById("fp-err"), okEl = document.getElementById("fp-ok");
  const btn = document.getElementById("fp-btn");
  errEl.style.display = "none"; okEl.style.display = "none";
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = T("err_invalid_email"); errEl.style.display = "block"; return; }
  btn.disabled = true;
  try {
    const res = await fetch(WORKER_URL + "/forgot-password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    if (data.ok) { okEl.textContent = T("req_sent"); okEl.style.display = "block"; }
    else { errEl.textContent = T("err_" + (data.error || "network")) ; errEl.style.display = "block"; btn.disabled = false; }
  } catch { errEl.textContent = T("err_network"); errEl.style.display = "block"; btn.disabled = false; }
}

async function doReset() {
  const pwd = document.getElementById("rp-new").value;
  const confirm = document.getElementById("rp-confirm").value;
  const errEl = document.getElementById("rp-err"), btn = document.getElementById("rp-btn");
  errEl.style.display = "none";
  if (pwd !== confirm) { errEl.textContent = T("err_mismatch"); errEl.style.display = "block"; return; }
  if (pwd.length < 10) { errEl.textContent = T("err_too_short"); errEl.style.display = "block"; return; }
  let kinds = 0;
  if (/[a-z]/.test(pwd)) kinds++;
  if (/[A-Z]/.test(pwd)) kinds++;
  if (/[0-9]/.test(pwd)) kinds++;
  if (/[^a-zA-Z0-9]/.test(pwd)) kinds++;
  if (kinds < 2) { errEl.textContent = T("err_too_weak"); errEl.style.display = "block"; return; }
  btn.disabled = true;
  try {
    const res = await fetch(WORKER_URL + "/reset-password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password: pwd }),
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById("reset-view").style.display = "none";
      document.getElementById("done-view").style.display = "block";
      sessionStorage.removeItem("md-pwd");
      localStorage.removeItem("md-saved-pwd");
    } else {
      const key = "err_" + (data.error || "network");
      errEl.textContent = (I18N[LANG] && I18N[LANG][key]) || T("err_network");
      errEl.style.display = "block"; btn.disabled = false;
    }
  } catch { errEl.textContent = T("err_network"); errEl.style.display = "block"; btn.disabled = false; }
}
</script>
</body>
</html>

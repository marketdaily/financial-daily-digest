<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語音快報 · MarketDaily</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="MarketDaily">
<meta property="og:title" content="語音快報 · MarketDaily">
<meta property="og:description" content="每天早上 3 分鐘,用聽的掌握台股美股重點。完全免費。">
<meta property="og:url" content="https://marketdaily.ai/audio">
<meta property="og:image" content="https://marketdaily.ai/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#6366f1">
<link rel="icon" type="image/svg+xml" href="/logo-icon.svg">
<link rel="apple-touch-icon" href="/logo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060611; --surface: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --primary: #6366f1; --primary-light: #818cf8; --violet: #8b5cf6;
  --emerald: #10b981; --amber: #fbbf24;
  --text: #f1f5f9; --text2: rgba(255,255,255,0.62); --text3: rgba(255,255,255,0.38);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:focus-visible { outline: 3px solid #818cf8; outline-offset: 2px; border-radius: 6px; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans TC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
  font-size: 17px; line-height: 1.7;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(99,102,241,0.035) 1px, transparent 1px),
    linear-gradient(90deg,rgba(99,102,241,0.035) 1px, transparent 1px);
  background-size: 72px 72px;
}
nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 24px; height: 64px;
  background: rgba(6,6,17,0.85);
  backdrop-filter: blur(28px) saturate(1.8);
  -webkit-backdrop-filter: blur(28px) saturate(1.8);
  border-bottom: 1px solid var(--border);
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Inter', sans-serif; font-weight: 800; font-size: 19px;
  color: var(--text); text-decoration: none; letter-spacing: -0.4px;
}
.logo em { font-style: normal; color: var(--primary-light); }
.logo-icon {
  width: 34px; height: 34px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--primary), var(--violet));
  box-shadow: 0 0 18px rgba(99,102,241,0.45);
}
.nav-right { display: flex; align-items: center; gap: 14px; }
.lang-btn {
  background: none; border: 1px solid var(--border2); color: var(--text2);
  border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.lang-btn:hover { color: var(--text); border-color: var(--primary-light); }
.nav-back { color: var(--text2); text-decoration: none; font-size: 14px; font-weight: 600; }
.nav-back:hover { color: var(--text); }
.wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
.hero { text-align: center; margin-bottom: 44px; }
.hero-badge {
  display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: 2px;
  color: var(--primary-light); border: 1px solid rgba(129,140,248,0.35);
  background: rgba(99,102,241,0.08); padding: 6px 16px; border-radius: 40px;
  margin-bottom: 18px;
}
.hero h1 { font-size: clamp(30px, 5.4vw, 44px); font-weight: 900; line-height: 1.25; letter-spacing: -0.5px; }
.hero h1 .grad {
  background: linear-gradient(100deg, var(--primary-light), var(--violet) 60%, #c4b5fd);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { color: var(--text2); margin-top: 14px; font-size: 16.5px; }
.ep {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  padding: 22px 24px; margin-bottom: 14px;
}
.ep.today { border-color: rgba(129,140,248,0.45); box-shadow: 0 0 34px rgba(99,102,241,0.12); }
.ep-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.ep-date { font-family: 'Inter', monospace; font-weight: 800; font-size: 17px; }
.ep-tag {
  font-size: 11.5px; font-weight: 700; letter-spacing: 1px;
  color: var(--emerald); background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.3); border-radius: 30px; padding: 2px 10px;
}
.ep-tag.today-tag { color: var(--amber); background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.3); }
.ep audio { width: 100%; height: 40px; }
.empty, .loading { text-align: center; color: var(--text3); padding: 44px 0; font-size: 15px; }
.note {
  margin-top: 36px; font-size: 13px; color: var(--text3); text-align: center; line-height: 1.8;
}
.outro { text-align: center; margin-top: 48px; }
.outro-link { color: var(--primary-light); text-decoration: none; font-weight: 700; font-size: 15px; }
.outro-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">
    <span class="logo-icon">
      <svg width="17" height="17" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="14" width="4" height="7" rx="1.5" fill="white" fill-opacity="0.55"/>
        <rect x="7" y="9" width="4" height="12" rx="1.5" fill="white" fill-opacity="0.78"/>
        <rect x="13" y="4" width="4" height="17" rx="1.5" fill="white"/>
        <circle cx="20" cy="3" r="2" fill="#fde68a"/>
      </svg>
    </span>
    Market<em>Daily</em>
  </a>
  <div class="nav-right">
    <button class="lang-btn" onclick="toggleLang()">EN</button>
    <a class="nav-back" href="index.html" data-i18n="nav_back">回首頁</a>
  </div>
</nav>

<div class="wrap">

  <header class="hero">
    <span class="hero-badge" data-i18n="hero_badge">🎙 語音快報</span>
    <h1 data-i18n-html="hero_h1">每天 3 分鐘<br><span class="grad">用聽的掌握台股美股</span></h1>
    <p data-i18n-html="hero_p">每個交易日早上,AI 把當天日報濃縮成 3 分鐘語音。<br>通勤、洗漱、開車時聽,完全免費。</p>
  </header>

  <div id="list"><div class="loading" data-i18n="loading">載入節目中…</div></div>

  <p class="note" data-i18n-html="note">內容為公開資訊整理,不構成投資建議,投資一定有風險。<br>想看完整進出場計畫?<a href="index.html" style="color:var(--primary-light)">免費訂閱日報</a>,每天早上 7 點寄到你信箱。</p>

  <footer class="outro">
    <a class="outro-link" href="index.html" data-i18n="outro_link">← 回到首頁</a>
  </footer>

</div>

<script>
/* ── i18n ── */
const i18n = {
  zh: {
    page_title: "語音快報 · MarketDaily",
    nav_back: "回首頁",
    hero_badge: "🎙 語音快報",
    hero_h1: "每天 3 分鐘<br><span class=\"grad\">用聽的掌握台股美股</span>",
    hero_p: "每個交易日早上,AI 把當天日報濃縮成 3 分鐘語音。<br>通勤、洗漱、開車時聽,完全免費。",
    loading: "載入節目中…",
    empty: "最近沒有可播放的集數,交易日早上 7:30 後再來看看。",
    today_tag: "今天",
    ep_tag: "晨間快報",
    note: "內容為公開資訊整理,不構成投資建議,投資一定有風險。<br>想看完整進出場計畫?<a href=\"index.html\" style=\"color:var(--primary-light)\">免費訂閱日報</a>,每天早上 7 點寄到你信箱。",
    outro_link: "← 回到首頁"
  },
  en: {
    page_title: "Audio Brief · MarketDaily",
    nav_back: "Home",
    hero_badge: "🎙 Audio Brief",
    hero_h1: "3 minutes a day<br><span class=\"grad\">Hear the TW & US markets</span>",
    hero_p: "Every trading morning, AI condenses the daily report into a 3-minute audio brief.<br>Listen while commuting or getting ready. Completely free.",
    loading: "Loading episodes…",
    empty: "No recent episodes available. Check back after 7:30 AM on trading days.",
    today_tag: "Today",
    ep_tag: "Morning Brief",
    note: "Content is a summary of public information, not investment advice. Investing involves risk.<br>Want the full entry/exit plans? <a href=\"index.html\" style=\"color:var(--primary-light)\">Subscribe free</a> — delivered to your inbox at 7:00 AM daily.",
    outro_link: "← Back to home"
  }
};
let LANG = localStorage.getItem("md-lang-v2") || "zh";
function applyLang(lang) {
  LANG = lang;
  const t = i18n[lang] || i18n.zh;
  document.title = t.page_title;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t[el.dataset.i18n]; if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const v = t[el.dataset.i18nHtml]; if (v) el.innerHTML = v;
  });
  document.querySelector('.lang-btn').textContent = lang === 'zh' ? 'EN' : '中';
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
}
function toggleLang() {
  const next = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('md-lang-v2', next);
  applyLang(next);
  renderList();
}

/* ── 集數載入:一次讀 manifest,對近 8 天取交集(不再逐日 HEAD 探測,避免必然的 404 console 噪音) ── */
const MEDIA = "https://media.marketdaily.ai";
let episodes = null;

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
async function fetchManifestKeys() {
  // 單次 fetch 取代舊版 8 次逐日 HEAD 探測;為免單次瞬斷就整頁顯示「無集數」,失敗重試一次
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const r = await fetch(`${MEDIA}/_list?prefix=audio_`);
      if (!r.ok) throw new Error(`http ${r.status}`);
      const data = await r.json();
      return data.keys || [];
    } catch (e) {
      if (attempt === 0) await new Promise(res => setTimeout(res, 500));
    }
  }
  return [];
}
async function loadEpisodes() {
  const days = [];
  for (let i = 0; i < 8; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push(fmtDate(d));
  }
  const present = new Set();
  const re = /^audio_(\d{4}-\d{2}-\d{2})_tw\.mp3$/;
  (await fetchManifestKeys()).forEach(k => {
    const m = re.exec(k);
    if (m) present.add(m[1]);
  });
  episodes = days.filter(d => present.has(d));
  renderList();
}
function renderList() {
  if (episodes === null) return;
  const t = i18n[LANG] || i18n.zh;
  const list = document.getElementById("list");
  if (!episodes.length) {
    list.innerHTML = `<div class="empty">${t.empty}</div>`;
    return;
  }
  const todayStr = fmtDate(new Date());
  list.innerHTML = episodes.map(d => `
    <div class="ep${d === todayStr ? " today" : ""}">
      <div class="ep-head">
        <span class="ep-date">${d}</span>
        <span class="ep-tag${d === todayStr ? " today-tag" : ""}">${d === todayStr ? t.today_tag : t.ep_tag}</span>
      </div>
      <audio controls preload="none" src="${MEDIA}/audio_${d}_tw.mp3"></audio>
    </div>`).join("");
}
applyLang(LANG);
loadEpisodes();
</script>
</body>
</html>
